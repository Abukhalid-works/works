<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1-Easy</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <div class="bgleft"></div>
        <div class="bgright"></div>
       <header class="header">
            <img class="logo" src="./Assets/pokemon_logo.png" alt="pikachu-logo">
            <img class="menu" src="./Assets/menu-line.png" alt="menu">
       </header>

    <div class="content">
        <h3>pokemon gen 1</h3>
        <h1>Pikachu</h1>
        <p>Pikachu is an Electric-type Pokémon introduced<br> in Generation 1. Pikachu are small, chubby,<br>
        and incredibly cute mouse-like Pokémon.<br>
        They are almost completely covered by<br>
        yellow fur</p>
        <span class="number"><b>___01/08</b></span>
    </div>
    <div class="pikachuimage">
        <img class="Pikachuimg" src="./Assets/pikachu_img.png" alt="pikachu">
    </div>
     <div class="pokemanball">
        <img class="Pokeballimg" src="./Assets/pokemon_ball.png" alt="pokeball">
     </div>
        <div class="dots">
            <span class="dotactive"></span>
            <span class="dot1"></span>
            <span class="dot2"></span>
            <span class="dot3"></span>
            <span class="dot4"></span>
        </div>
    </main>
