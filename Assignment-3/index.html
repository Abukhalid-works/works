<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Art Work</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <span class="dot dot1"></span>
        <span class="dot dot2"></span>
        <span class="dot dot3"></span>
        <span class="dot dot4"></span>

        <section class="art-section">

            <div class="section-header">
                <h2>Explore Art Work</h2>

                <a href="#">See All</a>
            </div>


            <div class="cards">

                <!-- CARD 1 -->
                <div class="card">

                    <div class="image-box">
                        <img src="./Assets/art1.png" alt="Monocular">
                    </div>

                    <div class="card-info">

                        <div class="title-row">
                            <h3>Monocular</h3>

                            <div class="likes">
                                <span>54.8k</span>
                                <span class="heart">♡</span>
                            </div>
                        </div>

                        <button>Place Bid</button>

                    </div>

                </div>


                <!-- CARD 2 -->
                <div class="card">

                    <div class="image-box">
                        <img src="./Assets/art2.png" alt="Horns Mask">
                    </div>

                    <div class="card-info">

                        <div class="title-row">
                            <h3>Horns Mask</h3>

                            <div class="likes">
                                <span>32.4k</span>
                                <span class="heart">♡</span>
                            </div>
                        </div>

                        <button>Place Bid</button>

                    </div>

                </div>


                <!-- CARD 3 -->
                <div class="card">

                    <div class="image-box">
                        <img src="./Assets/art3.png" alt="Light Moon">
                    </div>

                    <div class="card-info">

                        <div class="title-row">
                            <h3>Light Moon</h3>

                            <div class="likes">
                                <span>86.6k</span>
                                <span class="heart">♡</span>
                            </div>
                        </div>

                        <button>Place Bid</button>

                    </div>

                </div>


                <!-- CARD 4 -->
                <div class="card">

                    <div class="image-box">
                        <img src="./Assets/art4.png" alt="Skull Wire">
                    </div>

                    <div class="card-info">

                        <div class="title-row">
                            <h3>Skull Wire</h3>

                            <div class="likes">
                                <span>78.9k</span>
                                <span class="heart">♡</span>
                            </div>
                        </div>

                        <button>Place Bid</button>

                    </div>

                </div>


                <!-- CARD 5 -->
                <div class="card">

                    <div class="image-box">
                        <img src="./Assets/art4.png" alt="Spiderman">
                    </div>

                    <div class="card-info">

                        <div class="title-row">
                            <h3>Spiderman</h3>

                            <div class="likes">
                                <span>24.8k</span>
                                <span class="heart">♡</span>
                            </div>
                        </div>

                        <button>Place Bid</button>

                    </div>

                </div>


                <!-- CARD 6 -->
                <div class="card">

                    <div class="image-box">
                        <img src="./Assets/art3.png" alt="DeadPool">
                    </div>

                    <div class="card-info">

                        <div class="title-row">
                            <h3>DeadPool</h3>

                            <div class="likes">
                                <span>59.7k</span>
                                <span class="heart">♡</span>
                            </div>
                        </div>

                        <button>Place Bid</button>

                    </div>

                </div>


                <!-- CARD 7 -->
                <div class="card">

                    <div class="image-box">
                        <img src="./Assets/art2.png" alt="White Eye">
                    </div>

                    <div class="card-info">

                        <div class="title-row">
                            <h3>White Eye</h3>

                            <div class="likes">
                                <span>45.7k</span>
                                <span class="heart">♡</span>
                            </div>
                        </div>

                        <button>Place Bid</button>

                    </div>

                </div>


                <!-- CARD 8 -->
                <div class="card">

                    <div class="image-box">
                        <img src="./Assets/art1.png" alt="Plastic Spinal">
                    </div>

                    <div class="card-info">

                        <div class="title-row">
                            <h3>Plastic Spinal</h3>

                            <div class="likes">
                                <span>98.6k</span>
                                <span class="heart">♡</span>
                            </div>
                        </div>

                        <button>Place Bid</button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
